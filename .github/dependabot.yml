version: 2
updates:
# Fantomas.Core in the newest versioned backend, and nothing else. It is the one dependency worth
# knowing about the day it moves: the 8.x tab is there to serve the current release, so a release it
# does not have yet is a tab that is out of date. Everything else this project pins is pinned by the
# other backends too and moves with them in the monthly pull request below, which cannot include
# this folder as well: Dependabot refuses to see one directory in two nuget entries.
- package-ecosystem: nuget
  directory: "/src/server/FantomasOnlineV8"
  schedule:
    interval: daily
    time: "10:00"
    timezone: Europe/Brussels
  allow:
  - dependency-name: "Fantomas.Core"
  ignore:
  # Each versioned backend serves one Fantomas major on purpose, so a major bump does not update
  # this tab, it replaces it. A new major gets a new project alongside the old ones instead, and
  # that new folder is the one that belongs in this entry.
  - dependency-name: "Fantomas.Core"
    update-types:
    - "version-update:semver-major"
# Everything else, as one grouped pull request per ecosystem per month. Grouping is what keeps this
# bearable: the alternative is a pull request per package, and every one of them costs a full CI run
# that builds Fantomas from source.
- package-ecosystem: nuget
  directories:
  # The root holds Directory.Build.props, which is where Suave, the Amazon.Lambda packages and the
  # two analyzers have their versions: every lambda inherits them rather than naming them itself.
  - "/"
  - "/infrastructure"
  - "/src/client/fsharp"
  # Written out rather than globbed, because a glob over src/server would cover the folder the
  # entry above already claims, and Dependabot rejects the whole file over that.
  - "/src/server/ASTViewer"
  - "/src/server/FantomasOnlineMain"
  - "/src/server/FantomasOnlinePreview"
  - "/src/server/FantomasOnlineV6"
  - "/src/server/FantomasOnlineV7"
  - "/src/server/OakViewer"
  schedule:
    interval: monthly
    time: "10:00"
    timezone: Europe/Brussels
  groups:
    nuget:
      patterns:
      - "*"
  ignore:
  # Fantomas.Core belongs to the daily entry above. The older majors are pinned to their own
  # release line anyway, which is the whole point of having a tab per version.
  - dependency-name: "Fantomas.Core"
# The client is installed with Bun, and Bun has an ecosystem of its own here. Under npm the
# updater writes package.json and leaves bun.lock behind, because the npm updater knows
# package-lock.json and yarn.lock and nothing about this one.
- package-ecosystem: bun
  directory: "/src/client"
  schedule:
    interval: monthly
    time: "11:00"
    timezone: Europe/Brussels
  groups:
    bun:
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
    time: "12:00"
    timezone: Europe/Brussels
  groups:
    github-actions:
      patterns:
      - "*"
