name: PR

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6

      - name: Clone Fantomas
        run: dotnet fsi build.fsx -p Fantomas-Git

      - name: Build
        run: dotnet fsi build.fsx

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6

      - name: Clone Fantomas
        run: dotnet fsi build.fsx -p Fantomas-Git

      - name: Run analyzers
        run: dotnet fsi build.fsx -p Analyze

      # always(), because the run this most wants to report on is the one that just failed.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: analysis.sarif
          category: ionide-analyzers
